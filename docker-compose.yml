services:
  redis:
    image: redis:8-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s

  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports: ['8000:8000']
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build: .
    command: ['node', 'dist/main.worker.js']
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    # SIGTERM → воркер дорабатывает текущие задачи; даём на это время до SIGKILL
    stop_grace_period: 60s
    depends_on:
      redis: { condition: service_healthy }
